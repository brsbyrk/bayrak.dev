server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A directory with no index.html must be a 404, not a 403: `try_files $uri/`
    # would match the directory /blog/ (it exists, holding the post folders) and
    # nginx then refuses the listing. Listing $uri/index.html instead keeps the
    # directory out of the candidate list.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # =404 (not /404.html) so unknown paths carry a real 404 status. The old
    # form returned the error page with 200, which tells a crawler to index it.
    location / {
        try_files $uri $uri/index.html =404;
    }
}
